[package]
name = "splat-tui"
version = "0.1.0"
edition = "2021"
description = "View 3D Gaussian Splatting scenes (.ply / .splat) in the terminal"
license = "MIT"

[lib]
name = "splat_tui"
path = "src/lib.rs"

[[bin]]
name = "splat-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
glam = "0.29"
ratatui = "0.29"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
default = []
gpu = []
